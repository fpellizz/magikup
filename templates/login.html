<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7c3aed" id="theme-color-meta">
    <title>Login - Magiku(r)p</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="icon" type="image/png" href="{{ base_path }}/static/magikarp.png">

    <!-- Prevent flash of wrong theme -->
    <script>
        (function() {
            const stored = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = stored || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', theme);
            const themeColor = theme === 'dark' ? '#0a0a0a' : '#7c3aed';
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', themeColor);
        })();
    </script>

    <style>
        /* ==== v4.1.0 tokens (inline — this page is standalone, no style.css) ==== */
        :root {
            --primary: #7c3aed;
            --primary-hover: #6d28d9;
            --primary-foreground: #ffffff;
            --ring: #7c3aed;
            --accent-soft: rgba(124, 58, 237, .12);

            --background: #ffffff;
            --foreground: #18181b;
            --card: #ffffff;
            --pane: #fafafa;
            --muted: #f4f4f5;
            --muted-foreground: #71717a;
            --border: #e4e4e7;
            --input: #e4e4e7;
            --danger: #dc2626;
            --danger-bg: rgba(220, 38, 38, .12);

            --radius: 0.625rem;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            --shadow-sm: 0 1px 2px rgb(0 0 0 / .05);
        }

        [data-bs-theme="dark"] {
            --primary: #8b5cf6;
            --primary-hover: #a78bfa;
            --primary-foreground: #ffffff;
            --ring: #8b5cf6;
            --accent-soft: rgba(139, 92, 246, .20);

            --background: #0a0a0a;
            --foreground: #f5f5f5;
            --card: #171717;
            --pane: #1c1c1c;
            --muted: #262626;
            --muted-foreground: #a1a1aa;
            --border: rgba(255, 255, 255, .10);
            --input: rgba(255, 255, 255, .14);
            --danger: #f87171;
            --danger-bg: rgba(248, 113, 113, .16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--pane);
            color: var(--foreground);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            padding: 24px;
        }

        /* Theme Toggle */
        .theme-toggle-container {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 100;
        }

        .theme-toggle-btn {
            width: 40px;
            height: 40px;
            border-radius: calc(var(--radius) - 2px);
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--muted-foreground);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .16s ease, color .16s ease;
        }

        .theme-toggle-btn:hover {
            background: var(--accent-soft);
            color: var(--primary);
        }

        .theme-toggle-btn i {
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        /* ==== Split login frame ==== */
        .login-frame {
            width: 100%;
            max-width: 960px;
            display: flex;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgb(0 0 0 / .08);
            min-height: 560px;
        }

        /* Left dark brand panel */
        .brand-panel {
            width: 46%;
            flex-shrink: 0;
            background: #101114;
            color: #fff;
            padding: 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        /* The ONE allowed subtle gradient: brand-panel glow */
        .brand-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(600px 300px at 20% 10%, rgba(139, 92, 246, .28), transparent 60%);
            pointer-events: none;
        }

        .brand-lockup {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-tile {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 11px;
            /* the one allowed small gradient */
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            flex-shrink: 0;
        }

        .brand-tile img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .brand-wordmark {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .brand-copy {
            position: relative;
        }

        .brand-headline {
            font-size: 26px;
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -0.01em;
            margin-bottom: 14px;
            max-width: 360px;
        }

        .brand-sub {
            margin: 0;
            font-size: 14px;
            line-height: 1.6;
            color: rgba(255, 255, 255, .6);
            max-width: 380px;
        }

        .brand-version {
            position: relative;
            font-family: var(--font-mono);
            font-size: 12px;
            color: rgba(255, 255, 255, .4);
        }

        /* Right form panel */
        .form-panel {
            flex: 1;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
        }

        .form-inner {
            width: 100%;
            max-width: 360px;
        }

        .login-title {
            margin: 0 0 6px;
            font-size: 22px;
            font-weight: 600;
            color: var(--foreground);
        }

        .login-subtitle {
            margin: 0 0 28px;
            font-size: 14px;
            color: var(--muted-foreground);
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--foreground);
            margin-bottom: 7px;
        }

        .field {
            position: relative;
            margin-bottom: 18px;
        }

        .form-control {
            width: 100%;
            height: 42px;
            background: var(--background);
            border: 1px solid var(--input);
            border-radius: calc(var(--radius) - 2px);
            padding: 0 12px 0 38px;
            font-size: 14px;
            color: var(--foreground);
            transition: border-color .16s ease, box-shadow .16s ease;
        }

        .form-control::placeholder {
            color: var(--muted-foreground);
        }

        .form-control:focus {
            outline: none;
            background: var(--background);
            border-color: var(--ring);
            box-shadow: 0 0 0 3px var(--accent-soft);
            color: var(--foreground);
        }

        /* password field needs room for the toggle on the right */
        #password {
            padding-right: 40px;
        }

        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted-foreground);
            font-size: 15px;
            pointer-events: none;
            transition: color .16s ease;
        }

        .form-control:focus ~ .input-icon {
            color: var(--primary);
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted-foreground);
            cursor: pointer;
            font-size: 15px;
            padding: 4px;
            line-height: 0;
            border-radius: 6px;
            transition: color .16s ease;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .password-toggle:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        /* Remember me */
        .remember-forgot {
            margin-bottom: 24px;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
            min-height: auto;
        }

        .form-check .form-check-input {
            width: 16px;
            height: 16px;
            margin: 0;
            float: none;
            background-color: var(--background);
            border: 1px solid var(--input);
            cursor: pointer;
        }

        .form-check .form-check-input:focus {
            box-shadow: 0 0 0 3px var(--accent-soft);
            border-color: var(--ring);
        }

        .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .form-check-label {
            font-size: 13.5px;
            color: var(--muted-foreground);
            cursor: pointer;
        }

        /* Sign in button — SOLID violet, no gradient */
        .btn-login {
            width: 100%;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary);
            border: none;
            border-radius: calc(var(--radius) - 2px);
            color: var(--primary-foreground);
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: filter .16s ease;
        }

        .btn-login:hover {
            filter: brightness(.94);
        }

        .btn-login:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .btn-login:disabled {
            opacity: .75;
            cursor: not-allowed;
        }

        .btn-login .spinner-border {
            width: 17px;
            height: 17px;
            border-width: 2px;
        }

        /* Error alert */
        .alert {
            border: 1px solid transparent;
            border-radius: calc(var(--radius) - 2px);
            margin-bottom: 22px;
            padding: 12px 14px;
            font-size: 13.5px;
            display: flex;
            align-items: center;
        }

        .alert-danger {
            background: var(--danger-bg);
            color: var(--danger);
            border-color: color-mix(in srgb, var(--danger) 30%, transparent);
        }

        /* Mobile: collapse brand panel into a slim top strip */
        @media (max-width: 720px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .login-frame {
                flex-direction: column;
                max-width: 480px;
                margin: 0 auto;
                min-height: 100vh;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }

            .brand-panel {
                width: 100%;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 20px 24px;
            }

            .brand-copy,
            .brand-version {
                display: none;
            }

            .form-panel {
                padding: 32px 24px 48px;
                align-items: flex-start;
            }

            .form-inner {
                max-width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle-container">
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
            <i class="bi bi-sun-fill" id="theme-icon"></i>
        </button>
    </div>

    <!-- Split login frame -->
    <div class="login-frame">
        <!-- Left: dark brand panel -->
        <div class="brand-panel">
            <div class="brand-lockup">
                <span class="brand-tile">
                    <img src="{{ base_path }}/static/magikarp.png" alt="">
                </span>
                <span class="brand-wordmark">MagikUp</span>
            </div>
            <div class="brand-copy">
                <div class="brand-headline">PostgreSQL backup, restore &amp; transfer &mdash; in one place.</div>
                <p class="brand-sub">Direct or SSM-tunnelled connections, scheduled backups, remote storage and a full SQL query editor.</p>
            </div>
            <div class="brand-version">v4.2.0</div>
        </div>

        <!-- Right: form -->
        <div class="form-panel">
            <div class="form-inner">
                <h1 class="login-title">Sign in</h1>
                <p class="login-subtitle">Enter your credentials to continue.</p>

                <!-- Error Alert -->
                {% if error %}
                <div class="alert alert-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    {{ error }}
                </div>
                {% endif %}

                <!-- Login Form -->
                <form method="POST" action="{{ base_path }}/login" id="loginForm">
                    <!-- Username -->
                    <label for="username" class="form-label">Username</label>
                    <div class="field">
                        <input type="text"
                               class="form-control"
                               id="username"
                               name="username"
                               placeholder="admin"
                               required
                               autofocus>
                        <i class="bi bi-person input-icon"></i>
                    </div>

                    <!-- Password -->
                    <label for="password" class="form-label">Password</label>
                    <div class="field">
                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               placeholder="Enter your password"
                               required>
                        <i class="bi bi-lock input-icon"></i>
                        <button type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                tabindex="-1"
                                aria-label="Toggle password visibility">
                            <i class="bi bi-eye-fill" id="toggleIcon"></i>
                        </button>
                    </div>

                    <!-- Remember Me -->
                    <div class="remember-forgot">
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   id="rememberMe"
                                   name="remember_me">
                            <label class="form-check-label" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-login" id="loginBtn">
                        <span id="btnText">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </span>
                        <span id="btnSpinner" style="display: none;">
                            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                            Signing in...
                        </span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ============================================
        // Theme Management
        // ============================================

        function getPreferredTheme() {
            const stored = localStorage.getItem('theme');
            if (stored) return stored;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            updateThemeIcon(theme);
            updateThemeColor(theme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-bs-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);

            // Add rotation animation
            const icon = document.getElementById('theme-icon');
            icon.style.transform = 'rotate(360deg)';
            setTimeout(() => { icon.style.transform = ''; }, 300);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.className = theme === 'dark' ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
            }
        }

        function updateThemeColor(theme) {
            const meta = document.getElementById('theme-color-meta');
            if (meta) {
                meta.setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#7c3aed');
            }
        }

        // Initialize theme
        document.addEventListener('DOMContentLoaded', function() {
            setTheme(getPreferredTheme());
        });

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('theme')) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });

        // ============================================
        // Password Toggle
        // ============================================

        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const toggleIcon = document.getElementById('toggleIcon');

        passwordToggle.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            if (type === 'text') {
                toggleIcon.classList.remove('bi-eye-fill');
                toggleIcon.classList.add('bi-eye-slash-fill');
            } else {
                toggleIcon.classList.remove('bi-eye-slash-fill');
                toggleIcon.classList.add('bi-eye-fill');
            }
        });

        // ============================================
        // Form Submission
        // ============================================

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        loginForm.addEventListener('submit', function(e) {
            // Show loading state
            loginBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline';
        });

        // Auto-focus on username if error
        {% if error %}
        document.getElementById('username').focus();
        {% endif %}

        // Add enter key support
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginForm.submit();
            }
        });
    </script>
</body>
</html>
