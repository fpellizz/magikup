apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Generic overlay: base + a NetworkPolicy, for clusters where the ingress
# controller is reached through normal pod networking (NOT hostNetwork).
# The Secret (ENCRYPTION_KEY) is still applied out-of-band, not here.
namespace: magikup

commonLabels:
  app: magikup

resources:
  - ../../base
  - networkpolicy.yaml
