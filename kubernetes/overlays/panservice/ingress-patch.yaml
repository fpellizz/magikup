# panservice-specific ingress: real hostname + cert-manager issuer.
# Strategic-merge patch: annotations merge with the base; tls/rules are replaced
# with the values below (they carry the base's root-path backend).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: magikup
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - magikup.decisyon.com
      secretName: magikup-tls
  rules:
    - host: magikup.decisyon.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: magikup
                port:
                  number: 8000
