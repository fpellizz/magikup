apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base for this project: the cluster-agnostic workload.
#   * ServiceAccount (rbac.yaml)
#   * Deployment (deployment.yaml) — image is the bare repo name; the tag is
#     pinned per environment via `images:` in the overlay.
#   * PersistentVolumeClaims (pvc.yaml) — no storageClassName; set it per
#     environment in the overlay if the cluster needs a specific class.
#
# Config (ConfigMap), exposure (Service/Ingress), namespace and image tag live
# in the overlay under overlays/<env>/. Do not deploy this base directly.

labels:
  - pairs:
      app: magikup
    includeSelectors: true

resources:
  - rbac.yaml
  - deployment.yaml
  - pvc.yaml
